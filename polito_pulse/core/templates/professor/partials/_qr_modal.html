<div class="flex flex-col items-center gap-4 p-6 text-center">
  <div>
    <h2 class="text-xl font-semibold">Lecture {{ lecture.number }} Check-in</h2>
    <p class="mt-1 text-sm text-zinc-500">Students scan to open the live class pulse.</p>
  </div>
  <img src="data:image/png;base64,{{ qr_data }}" alt="Student check-in QR code" class="size-64 rounded-lg outline outline-1 -outline-offset-1 outline-black/10">
  <code class="telemetry max-w-full break-all rounded-lg bg-zinc-100 px-3 py-2 text-xs">{{ checkin_url }}</code>
  <button type="button" class="h-10 w-full rounded-lg bg-slate-900 text-sm text-white" onclick="document.getElementById('qr-dialog').close()">Close</button>
</div>
