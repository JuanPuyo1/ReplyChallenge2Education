<article class="surface flex min-h-[500px] flex-col justify-between p-4">
  <div>
    <header class="mb-3 flex items-start justify-between gap-3">
      <h3 class="text-xl font-semibold">{{ animation.title }}</h3>
      <span class="whitespace-nowrap rounded-full bg-zinc-100 px-3 py-1.5 text-xs text-zinc-500">
        Slide {{ animation.gap.slide_number }} • {{ animation.exam_link }}
      </span>
    </header>
    <video class="aspect-video w-full rounded-lg bg-zinc-950 outline outline-1 -outline-offset-1 outline-black/10"
           src="{{ animation.video_url }}" autoplay loop muted playsinline controls></video>
  </div>
  <details class="group mt-4 rounded-lg border border-zinc-200 bg-white">
    <summary class="pressable flex h-10 cursor-pointer list-none items-center justify-between px-3 text-sm font-medium">
      Read Step-by-Step LaTeX Intuition
      <span class="telemetry text-xs text-zinc-500 group-open:hidden">[ expand ]</span>
      <span class="telemetry hidden text-xs text-zinc-500 group-open:inline">[ close ]</span>
    </summary>
    <div class="border-t border-zinc-100 p-4 text-sm leading-relaxed text-zinc-600">
      {{ animation.latex_intuition }}
      <p class="mt-3 rounded-lg bg-zinc-100 p-3">$N = Z - P$ and $\varepsilon \to 0^+$ preserve the professor’s slide notation.</p>
    </div>
  </details>
</article>
